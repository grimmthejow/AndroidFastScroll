plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xapps.media.xmusic.fastscroll.sample'
    compileSdk 37
    defaultConfig {
        applicationId 'com.xapps.media.xmusic.fastscroll.sample'
        minSdk 26
        targetSdk 37
        versionCode Integer.parseInt(VERSION_CODE)
        versionName VERSION_NAME
    }
    buildFeatures {
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("SAMPLE_STORE_FILE") ?: "/dev/null")
            storePassword System.getenv("SAMPLE_STORE_PASSWORD")
            keyAlias System.getenv("SAMPLE_KEY_ALIAS")
            keyPassword System.getenv("SAMPLE_KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation project(':library')
}
